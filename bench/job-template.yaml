# One-off benchmark run. NOT managed by Argo (lives outside gitops/ on purpose).
# Start a run:  kubectl create -f bench/job-template.yaml
# (create, not apply: generateName gives every run its own Job name)
# Before each run: set RUN_ID (new every time), TARGET_URL, MODEL, PHASE,
# CONCURRENCY, MAX_PROMPTS, and API_KEY (llama.cpp only).
# RUN_ID format: <tool>-c<concurrency>-<cold|warm><n>-<YYYYMMDD>
# Defaults below = cold llama.cpp run.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: bench-
  namespace: bench
  labels:
    app: bench-harness
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: bench-harness      # must match NetworkPolicy llm-servers-from-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02.novalocal   # servers run on worker-01
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: harness
          image: ghcr.io/chpc-tech-eval/inference-fabric-scc26/bench-harness@sha256:39592c92f226b53ae4328ade7dc0050a36cafb49a6a337e31dcc61536fb5f3ab
          env:
            - { name: RUN_ID,       value: "llamacpp-c1-cold1-20261121" }
            - { name: TARGET_URL,   value: "http://llm-cpu.inference.svc.cluster.local:8080/v1" }
            # Ollama: http://ollama-cpu.inference.svc.cluster.local:11434/v1
            - { name: MODEL,        value: "qwen2.5-1.5b-instruct" }
            # Ollama: qwen2.5-1.5b-bench
            - { name: PHASE,        value: "cold" }
            - { name: CONCURRENCY,  value: "1" }
            - { name: MAX_PROMPTS,  value: "1" }       # cold run = 1; warm = "0" (all)
            - { name: PARALLEL,     value: "4" }       # recorded in summary.json only
            - { name: CTX,          value: "4096" }    # per slot; recorded only
            - name: API_KEY                            # llama.cpp only: DELETE this block for Ollama
              valueFrom:
                secretKeyRef:
                  name: bench-llm-key
                  key: api-key
          resources:
            requests: { cpu: "500m", memory: 512Mi }
            limits:   { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - { name: results, mountPath: /results }
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results
