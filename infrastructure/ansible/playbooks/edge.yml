# Sets up edge-01: firewall, WireGuard VPN and Pi-hole DNS.

- name: Set up edge-01
  hosts: edge_nodes
  become: true

  tasks:
    - name: Install packages
      dnf:
        name: [nftables, wireguard-tools, podman]
        state: present
      tags: [firewall, wireguard, pihole]

    # ---------------- firewall ----------------
    - name: Stop firewalld
      systemd:
        name: firewalld
        state: stopped
        enabled: false
      ignore_errors: true
      tags: firewall

    - name: Allow edge-01 to forward traffic
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
      tags: firewall

    - name: Write the nftables rules
      copy:
        dest: /etc/sysconfig/nftables.conf
        mode: "0600"
        validate: nft -c -f %s    # check the rules before saving
        content: |
          flush ruleset

          define UPLINK = "{{ ansible_facts.default_ipv4.interface }}"
          define MGMT = {{ mgmt_cidr }}
          define K8S = {{ k8s_cidr }}
          define VPN = {{ vpn_cidr }}

          table inet filter {
            chain input {
              type filter hook input priority filter; policy drop;
              iifname "lo" accept
              ct state established,related accept
              ip protocol icmp accept

              # wireguard from anywhere
              udp dport 51820 accept

              # ssh from the vpn, plus our public IPs during setup
              tcp dport 22 ip saddr $VPN accept
          {% for ip in bootstrap_ssh_cidrs %}
              tcp dport 22 ip saddr {{ ip }} accept
          {% endfor %}

              # dns from our own networks
              meta l4proto { tcp, udp } th dport 53 ip saddr { $MGMT, $K8S, $VPN } accept

              # pi-hole web page from the vpn
              tcp dport { 80, 443 } ip saddr $VPN accept

              # wazuh agents and the dashboard's API calls
              tcp dport { 1514, 1515, 55000 } ip saddr { $MGMT, $K8S, $VPN } accept
            }

            chain forward {
              type filter hook forward priority filter; policy drop;
              ct state established,related accept
              # vpn users can only reach our private networks
              iifname "wg0" ip daddr { $MGMT, $K8S } accept
            }
          }

          # make vpn traffic look like it comes from edge-01
          table ip nat {
            chain postrouting {
              type nat hook postrouting priority srcnat; policy accept;
              ip saddr $VPN oifname $UPLINK masquerade
            }
          }
      notify: reload nftables
      tags: firewall

    - name: Start nftables
      systemd:
        name: nftables
        enabled: true
        state: started
      tags: firewall

    # ---------------- wireguard ----------------
    - name: Make the server keys
      shell: |
        umask 077
        wg genkey > /etc/wireguard/wg0.key
        wg pubkey < /etc/wireguard/wg0.key > /etc/wireguard/wg0.pub
      args:
        creates: /etc/wireguard/wg0.key
      tags: wireguard

    - name: Read the server private key
      command: cat /etc/wireguard/wg0.key
      register: wg_private_key
      changed_when: false
      no_log: true    # don't print the private key!!
      tags: wireguard

    - name: Read the server public key
      command: cat /etc/wireguard/wg0.pub
      register: wg_public_key
      changed_when: false
      tags: wireguard

    - name: Write the WireGuard config
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wireguard_server_address }}
          ListenPort = 51820
          PrivateKey = {{ wg_private_key.stdout }}
          {% for peer in wireguard_peers %}

          # {{ peer.name }}
          [Peer]
          PublicKey = {{ peer.public_key }}
          AllowedIPs = {{ peer.address }}
          {% endfor %}
      no_log: true
      notify: restart wireguard
      tags: wireguard

    - name: Start WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      tags: wireguard

    - name: Show what everyone needs for their VPN tunnel
      debug:
        msg:
          - "Server public key: {{ wg_public_key.stdout }}"
          - "Endpoint: {{ ansible_host }}:51820"
          - "AllowedIPs: {{ vpn_cidr }}, {{ mgmt_cidr }}, {{ k8s_cidr }}"
      tags: wireguard

    # ---------------- pi-hole ----------------
    - name: Folder for pi-hole's data
      file:
        path: /opt/pihole
        state: directory
        mode: "0755"
      tags: pihole

    - name: Set up pi-hole as a container service
      copy:
        dest: /etc/containers/systemd/pihole.container
        mode: "0600"
        content: |
          [Container]
          Image=docker.io/pihole/pihole:latest
          ContainerName=pihole
          Network=host
          Volume=/opt/pihole:/etc/pihole:Z
          Environment=TZ=Africa/Johannesburg
          Environment=FTLCONF_webserver_api_password={{ pihole_password }}
          Environment=FTLCONF_dns_listeningMode=all
          Environment=FTLCONF_dns_rateLimit_count=0
          Environment="FTLCONF_dns_upstreams={{ pihole_upstream_dns }}"
          Environment="FTLCONF_dns_hosts={% for host in groups['all'] %}{{ hostvars[host].private_ip | default(hostvars[host].ansible_host) }} {{ host }}.{{ team_domain }} {{ host }}{% if not loop.last %};{% endif %}{% endfor %};10.151.0.100 grafana.{{ team_domain }};10.151.0.100 wazuh.{{ team_domain }};10.151.0.100 platform.{{ team_domain }}"

          [Service]
          Restart=always
          TimeoutStartSec=300

          [Install]
          WantedBy=multi-user.target
      no_log: true    # has the pi-hole password in it
      notify: restart pihole
      tags: pihole

    - name: Start pi-hole
      systemd:
        name: pihole
        daemon_reload: true
        state: started
      tags: pihole
    # ---------------- wazuh manager ----------------
    - name: Add the Wazuh package repo
      yum_repository:
        name: wazuh
        description: Wazuh repository
        baseurl: https://packages.wazuh.com/4.x/yum/
        gpgkey: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        gpgcheck: true
      tags: wazuh

    - name: Install the Wazuh manager
      dnf:
        name: wazuh-manager-4.14.9
        state: present
      tags: wazuh

    - name: Let the manager read Suricata's alerts
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} SCC26 SURICATA -->"
        block: |
          <ossec_config>
            <localfile>
              <log_format>json</log_format>
              <location>/var/log/suricata/eve.json</location>
            </localfile>
          </ossec_config>
      notify: restart wazuh-manager
      tags: wazuh

    - name: Start the Wazuh manager
      systemd:
        name: wazuh-manager
        enabled: true
        state: started
      tags: wazuh

    # ---------------- suricata ----------------
    - name: Add EPEL (where Suricata comes from)
      dnf:
        name: epel-release
        state: present
      tags: suricata

    - name: Install Suricata
      dnf:
        name: suricata
        state: present
      tags: suricata

    - name: Watch edge-01's network card (IDS mode - watching, not blocking)
      lineinfile:
        path: /etc/sysconfig/suricata
        regexp: '^OPTIONS='
        line: 'OPTIONS="-i {{ ansible_facts.default_ipv4.interface }} --user suricata"'
      notify: restart suricata
      tags: suricata

    - name: Download the detection rules
      command: suricata-update
      args:
        creates: /var/lib/suricata/rules/suricata.rules
      notify: restart suricata
      tags: suricata

    - name: Check the Suricata config is valid
      command: suricata -T -c /etc/suricata/suricata.yaml
      changed_when: false
      tags: suricata

    - name: Let Suricata write its own log files
      file:
        path: /var/log/suricata
        state: directory
        owner: suricata
        group: suricata
        recurse: true
      notify: restart suricata
      tags: suricata
      
    - name: Start Suricata
      systemd:
        name: suricata
        enabled: true
        state: started
      tags: suricata

    # ---------------- filebeat ----------------
    - name: Install Filebeat (from the Wazuh repo)
      dnf:
        name: filebeat
        state: present
      tags: filebeat

    - name: Folder for the indexer's CA certificate
      file:
        path: /etc/filebeat/certs
        state: directory
        mode: "0755"
      tags: filebeat

    - name: Copy the indexer's CA certificate (public)
      copy:
        src: "{{ playbook_dir }}/../files/wazuh-indexer-root-ca.pem"
        dest: /etc/filebeat/certs/root-ca.pem
        mode: "0644"
      notify: restart filebeat
      tags: filebeat

    - name: Download Wazuh's alerts template
      get_url:
        url: https://raw.githubusercontent.com/wazuh/wazuh/v4.14.9/extensions/elasticsearch/7.x/wazuh-template.json
        dest: /etc/filebeat/wazuh-template.json
        mode: "0644"
        force: true
      notify: restart filebeat
      tags: filebeat

    - name: Install Wazuh's Filebeat module
      unarchive:
        src: https://packages.wazuh.com/4.x/filebeat/wazuh-filebeat-0.3.tar.gz
        dest: /usr/share/filebeat/module
        remote_src: true
        creates: /usr/share/filebeat/module/wazuh
      tags: filebeat

    - name: Write the Filebeat settings
      copy:
        dest: /etc/filebeat/filebeat.yml
        mode: "0600"
        content: |
          # Send Wazuh manager alerts to the indexer, via HAProxy -> Traefik.
          output.elasticsearch:
            hosts: ["10.151.0.100:9200"]
            protocol: https
            username: "${username}"
            password: "${password}"
            ssl.certificate_authorities: ["/etc/filebeat/certs/root-ca.pem"]
            ssl.verification_mode: certificate
          setup.template.json.enabled: true
          setup.template.json.path: /etc/filebeat/wazuh-template.json
          setup.template.json.name: wazuh
          setup.template.overwrite: true
          setup.ilm.overwrite: true
          setup.ilm.enabled: false
          filebeat.modules:
            - module: wazuh
              alerts:
                enabled: true
              archives:
                enabled: false
          logging.level: info
          logging.to_files: true
          logging.files:
            path: /var/log/filebeat
            name: filebeat
            keepfiles: 7
            permissions: 0644
          logging.metrics.enabled: false
          seccomp:
            default_action: allow
            syscalls:
              - action: allow
                names:
                  - rseq
      notify: restart filebeat
      tags: filebeat

    - name: Create Filebeat's keystore
      command: filebeat keystore create
      args:
        creates: /var/lib/filebeat/filebeat.keystore
      tags: filebeat

    - name: Store the indexer login in the keystore (never in a file)
      command: "filebeat keystore add {{ item.key }} --stdin --force"
      args:
        stdin: "{{ item.value }}"
      loop:
        - { key: username, value: admin }
        - { key: password, value: "{{ (lookup('file', lookup('env', 'HOME') ~ '/.config/scc26-secrets/wazuh-indexer-creds.yaml') | from_yaml).stringData.INDEXER_PASSWORD }}" }
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      changed_when: false
      tags: filebeat

    - name: Start Filebeat
      systemd:
        name: filebeat
        enabled: true
        state: started
      tags: filebeat

  handlers:
    - name: reload nftables
      systemd:
        name: nftables
        state: reloaded

    - name: restart wireguard
      systemd:
        name: wg-quick@wg0
        state: restarted

    - name: restart pihole
      systemd:
        name: pihole
        daemon_reload: true
        state: restarted
    
    - name: restart wazuh-manager
      systemd:
        name: wazuh-manager
        state: restarted

    - name: restart suricata
      systemd:
        name: suricata
        state: restarted

    - name: restart filebeat
      systemd:
        name: filebeat
        state: restarted