# Builds our Hermes image.
# On a PR it only test-builds it. After merging into dev it pushes it to GHCR.
name: acp-hermes-image
on:
  pull_request:
    paths: ["images/acp-hermes/**", ".github/workflows/acp-hermes-image.yml"]
  push:
    branches: [dev]
    paths: ["images/acp-hermes/**", ".github/workflows/acp-hermes-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (not on pull requests)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/acp-hermes
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/acp-hermes:sha-${{ github.sha }}
      # prints the image + digest we need to put in hermes.yaml
      - name: Show the digest to pin
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${GITHUB_REPOSITORY}/acp-hermes@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
