name: bench-image

on:
  push:
    branches: [dev]
    paths:
      - "bench/Dockerfile"
      - "bench/*.py"
      - "bench/**/*.py"
      - "bench/requirements*.txt"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/bench-harness

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint and compile the harness
        run: |
          python -m pip install pyflakes
          python -m pyflakes bench
          python -m compileall -q bench

      - name: Warn if the base image is not pinned by digest
        run: |
          if grep -E '^FROM ' bench/Dockerfile | grep -v '@sha256:'; then
            echo "::warning::bench/Dockerfile has a FROM line not pinned by digest"
          fi

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Immutable tag only: sha-<full commit>. No "latest".
          tags: |
            type=sha,format=long,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: bench
          file: bench/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record image and digest
        run: |
          {
            echo "### Benchmark harness image"
            echo ""
            echo "- Image: \`${{ env.IMAGE }}\`"
            echo "- Tag: \`sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
