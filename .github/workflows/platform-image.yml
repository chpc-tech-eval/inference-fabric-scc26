name: platform-image

on:
  push:
    branches: [dev]
    paths:
      - "platform/**"
      - ".github/workflows/platform-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/student-platform

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Immutable tag only: sha-<full commit>. No "latest".
          tags: |
            type=sha,format=long,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record image and digest
        run: |
          {
            echo "### Platform image"
            echo ""
            echo "- Image: \`${{ env.IMAGE }}\`"
            echo "- Tag: \`sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
