apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: "13.7.0"
      helm:
        valueFiles:
          - $values/gitops/resources/grafana/values.yaml
    - repoURL: https://github.com/chpc-tech-eval/inference-fabric-scc26.git
      targetRevision: dev
      ref: values
    - repoURL: https://github.com/chpc-tech-eval/inference-fabric-scc26.git
      targetRevision: dev
      path: gitops/resources/grafana-extras
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
