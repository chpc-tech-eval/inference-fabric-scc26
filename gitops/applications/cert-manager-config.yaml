apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the cert-manager controller
spec:
  project: default
  source:
    repoURL: https://github.com/chpc-tech-eval/inference-fabric-scc26.git
    targetRevision: dev
    path: gitops/resources/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
