apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-cpu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/chpc-tech-eval/inference-fabric-scc26.git'
    targetRevision: dev
    path: gitops/resources/ollama-cpu
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
