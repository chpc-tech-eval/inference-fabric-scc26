apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-control-plane-hermes
  namespace: agent-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceName: agent-control-plane-hermes
  replicas: 1  # Mandatory: single replica only
  selector:
    matchLabels:
      app: acp-hermes
  template:
    metadata:
      labels:
        app: acp-hermes
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermes-worker
          image: ghcr.io/chpc-tech-eval/inference-fabric-scc26/acp-hermes@sha256:187720bd32aa05c2400af94eaf80ecb388612d80c7003c80b84c415d6b5a9bd6  # team image: instructor base + images/acp-hermes/patch_acp.py
          env:
            - name: HERMES_HOME
              value: /var/lib/hermes/admin-readonly
            - name: ACP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acp-db-app
                  key: ACP_DATABASE_URL
            - name: ACP_MODEL
              value: "qwen2.5-1.5b-instruct"  # CPU-first: llm-cpu --alias
            - name: ACP_MODEL_BASE_URL
              value: "http://llm-cpu.inference.svc.cluster.local:8080/v1"  # CPU-first: in-cluster llm-cpu
            - name: ACP_PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:80"
            - name: ACP_RUN_TIMEOUT_SECONDS
              value: "300"  # CPU model answers take tens of seconds
            - name: ACP_HERMES_MIN_CONTEXT
              value: "4096"  # same as llm-cpu context per request
            - name: HERMES_DISABLE_LAZY_INSTALLS
              value: "1"  # sealed image: fail fast instead of pip-installing at runtime (egress is denied)
            - name: ACP_TENANT_ID
              value: "student-platform"
            - name: ACP_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acp-model
                  key: ACP_MODEL_API_KEY
          volumeMounts:
            - name: hermes-data
              mountPath: /var/lib/hermes/admin-readonly
  volumeClaimTemplates:
    - metadata:
        name: hermes-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: cinder-agent-retain
        resources:
          requests:
            storage: 5Gi
