apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-control-plane-hermes
  namespace: agent-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceName: agent-control-plane-hermes
  replicas: 1  # Mandatory: single replica only
  selector:
    matchLabels:
      app: acp-hermes
  template:
    metadata:
      labels:
        app: acp-hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermes-worker
          image: ghcr.io/nyameko/agent-control-plane-hermes@sha256:6ec37a755e57ef868a2fcce6052535588d14742bc85df75ab973dae811f1bdda  # instructor-pinned, approved by Val
          env:
            - name: HERMES_HOME
              value: /var/lib/hermes/admin-readonly
            - name: ACP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acp-db-app
                  key: ACP_DATABASE_URL
            - name: ACP_MODEL
              value: "qwen2.5-1.5b-instruct"  # CPU-first: llm-cpu --alias
            - name: ACP_MODEL_BASE_URL
              value: "http://llm-cpu.inference.svc.cluster.local:8080/v1"  # CPU-first: in-cluster llm-cpu
            - name: ACP_PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:80"
            - name: ACP_RUN_TIMEOUT_SECONDS
              value: "300"  # CPU model answers take tens of seconds
            - name: ACP_TENANT_ID
              value: "student-platform"
            - name: ACP_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acp-model
                  key: ACP_MODEL_API_KEY
          volumeMounts:
            - name: hermes-data
              mountPath: /var/lib/hermes/admin-readonly
  volumeClaimTemplates:
    - metadata:
        name: hermes-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: cinder-agent-retain
        resources:
          requests:
            storage: 5Gi
