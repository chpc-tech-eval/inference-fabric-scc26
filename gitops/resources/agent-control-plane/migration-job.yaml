apiVersion: batch/v1
kind: Job
metadata:
  name: acp-db-migration
  namespace: agent-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migration
          image: ghcr.io/nyameko/agent-control-plane@sha256:750b0ceb03fc3d09ef71063b5424716f14944df7be082485689dba6f2ff68f1c
          command: ["python", "-m", "agent_control_plane.migrate"]
          env:
            - name: ACP_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acp-db-owner
                  key: ACP_MIGRATION_DATABASE_URL
