apiVersion: v1
kind: Service
metadata:
  name: acp-api
  namespace: agent-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: acp-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acp-api
  namespace: agent-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acp-api
  template:
    metadata:
      labels:
        app: acp-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: <APPROVED_ACP_API_IMAGE_DIGEST>  # Update once provided by CI/CD
          ports:
            - containerPort: 8080
          env:
            - name: ACP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acp-db-app
                  key: url
            - name: ACP_TENANT_ID
              value: "student-platform"
            - name: ACP_JWT_PUBLIC_KEY_FILE
              value: "/etc/acp-jwt/public-key.pem"
          volumeMounts:
            - name: jwt-verification-key
              mountPath: /etc/acp-jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: jwt-verification-key
          secret:
            secretName: acp-verification
