apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform
  namespace: student-platform
  labels:
    app: student-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-platform
  template:
    metadata:
      labels:
        app: student-platform
    spec:
      securityContext:
        fsGroup: 1000   # lets the non-root user read the mounted signing key
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: platform
          image: ghcr.io/chpc-tech-eval/inference-fabric-scc26/student-platform:sha-99b889b5cb1b6eb5e4808bbe0f50238b7e3d031e
          ports:
            - containerPort: 4321
          env:
            - name: TEAM_NAME
              value: "SCC26 Team"
            - name: PROJECT_NAME
              value: "Inference Fabric"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-platform-db
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-platform-app
                  key: SESSION_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-platform-app
                  key: ADMIN_PASSWORD
            # --- Agent Control Plane (Week 4) ---
            - name: ACP_BASE_URL
              value: "http://acp-api.agent-control-plane.svc.cluster.local:8080"
            - name: ACP_SIGNING_KEY_FILE
              value: "/var/run/acp-signing/private.pem"
            - name: ACP_JWT_ISSUER
              value: "quantum-platform"
            - name: ACP_JWT_SUBJECT_PREFIX
              value: "urn:quantum-platform:user:"
            - name: ACP_TENANT_ID
              value: "nyameko"
            - name: ACP_DIAGNOSTIC
              value: "quantum-platform-pod-readiness"
          volumeMounts:
            - name: acp-signing
              mountPath: /var/run/acp-signing
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4321
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: acp-signing
          secret:
            secretName: acp-signing
            defaultMode: 0440   # group-readable (fsGroup 1000); not world-readable
            items:
              - key: private.pem   # the key name shown by: kubectl describe secret acp-signing
                path: private.pem
