apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: student-platform
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: student-platform
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "platform"
            - name: POSTGRES_USER
              value: "platform"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-platform-db
                  key: POSTGRES_PASSWORD
                  optional: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-cinder-sc-retain
        resources:
          requests:
            storage: 5Gi
