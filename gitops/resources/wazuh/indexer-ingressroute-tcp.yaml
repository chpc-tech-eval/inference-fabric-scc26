apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: wazuh-indexer-passthrough
  namespace: wazuh
spec:
  entryPoints:
    - wazuh-indexer # Or port 9200 entrypoint configured in Traefik
  routes:
    - match: HostSNI(`*`)
      services:
        - name: wazuh-indexer
          port: 9200
