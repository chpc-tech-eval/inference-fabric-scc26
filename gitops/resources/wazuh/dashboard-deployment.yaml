apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.7.0
          ports:
            - containerPort: 5601
          env:
            # admin login for the indexer
            - name: INDEXER_USERNAME
              valueFrom: { secretKeyRef: { name: wazuh-indexer-creds, key: INDEXER_USERNAME } }
            - name: INDEXER_PASSWORD
              valueFrom: { secretKeyRef: { name: wazuh-indexer-creds, key: INDEXER_PASSWORD } }
            # the dashboard's own service login (kibanaserver)
            - name: DASHBOARD_USERNAME
              valueFrom: { secretKeyRef: { name: wazuh-indexer-creds, key: DASHBOARD_USERNAME } }
            - name: DASHBOARD_PASSWORD
              valueFrom: { secretKeyRef: { name: wazuh-indexer-creds, key: DASHBOARD_PASSWORD } }
          volumeMounts:
            # replace only this one file; everything else in config/ stays from the image
            - name: dashboard-config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: dashboard-config
          configMap:
            name: wazuh-dashboard-config
