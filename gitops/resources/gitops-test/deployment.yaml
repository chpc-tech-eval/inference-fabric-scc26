# A tiny web server (1 replica) that serves the ConfigMap's message on port 8080.
# Named gitops-proof because the drift test scales "deployment gitops-proof".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-proof
  namespace: gitops-test
  labels:
    app: gitops-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-proof
  template:
    metadata:
      labels:
        app: gitops-proof
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: docker.io/library/busybox:1.37
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: page
              mountPath: /www
      volumes:
        - name: page
          configMap:
            name: gitops-proof
            items:
              - key: message
                path: index.html
