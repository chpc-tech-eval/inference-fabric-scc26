apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu
  namespace: inference
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-cpu
  template:
    metadata:
      labels:
        app: ollama-cpu
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01.novalocal
      containers:
        - name: ollama
          image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          resources:
            requests:
              cpu: "6"
              memory: "6Gi"
            limits:
              cpu: "6"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-cpu-models
