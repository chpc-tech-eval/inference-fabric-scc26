server:
  retention: 15d
  persistentVolume:
    enabled: true
    size: 10Gi
    # storageClass: <only if the default isn't Cinder>

  extraSecretMounts:
    - name: llm-cpu-metrics-key
      mountPath: /etc/prometheus/secrets/llm-cpu
      secretName: llm-cpu-metrics-key
      readOnly: true

prometheus-node-exporter:
  enabled: true
kube-state-metrics:
  enabled: true

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: haproxy
    static_configs:
      - targets: ['api-lb-01:8404']
  - job_name: llm-cpu
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/llm-cpu/api-key
    static_configs:
      - targets: ['llm-cpu.inference.svc.cluster.local:8080']
