apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-cpu
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-cpu
  template:
    metadata:
      labels:
        app: llm-cpu
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01.novalocal
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: model-downloader
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              MODEL="/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
              if [ ! -f "$MODEL" ]; then
                curl -fL -o "$MODEL" \
                  "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-m"
            - "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--alias"
            - "qwen2.5-1.5b-instruct"
            - "--threads"
            - "6"
            - "--parallel"
            - "4"
            - "--ctx-size"
            - "16384"
            - "--metrics"
            - "--api-key-file"
            - "/secrets/api-key"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "6"
              memory: "6Gi"
            limits:
              cpu: "6"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
            - name: api-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-cpu-models
        - name: api-key
          secret:
            secretName: llm-cpu-key
